name: PR Checks

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Android Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-pr-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-pr-${{ github.event.pull_request.number }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: validate
    if: always()

    steps:
      - name: Comment PR result
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ needs.validate.result }}' === 'success';

            const body = success
              ? `## ✅ PR Checks passed

              All automated checks have passed successfully.

              - ✅ Android Lint
              - ✅ Unit tests
              - ✅ Debug build
              - 📦 Debug APK available as a workflow artifact

              This PR is ready for review/merge.`
              : `## ❌ PR Checks failed

              One or more automated checks failed.

              Please open the workflow details and review the failing step before merging.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.data.find(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('PR Checks')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }