name: CI

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Get short SHA
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK - long retention
        if: success() && github.ref_name == 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: develop-debug-${{ steps.sha.outputs.short_sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK - short retention
        if: success() && github.ref_name != 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-debug-${{ steps.sha.outputs.short_sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload test & lint reports - long retention
        if: always() && github.ref_name == 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test & lint reports - short retention
        if: always() && github.ref_name != 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 1