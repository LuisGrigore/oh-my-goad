name: Release Android APK

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Publish Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout the exact commit produced by the merged PR
      # ------------------------------------------------------------

      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # Set up Java / Gradle
      # ------------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # Validate PR title
      #
      # Required format:
      # Release X.Y.Z
      # Example:
      # Release 1.4.0
      # ------------------------------------------------------------

      - name: Validate release PR title
        id: pr
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_TITLE" =~ ^Release\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: This merged PR is not a valid release PR."
            echo "Expected title: Release X.Y.Z"
            echo "Actual title: $PR_TITLE"
            exit 1
          fi

          VERSION_NAME="${BASH_REMATCH[1]}"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Release PR title: $PR_TITLE"
          echo "Release version: $VERSION_NAME"

      # ------------------------------------------------------------
      # Read version.properties
      # ------------------------------------------------------------

      - name: Read version.properties
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_FILE="version.properties"

          if [[ ! -f "$VERSION_FILE" ]]; then
            echo "ERROR: $VERSION_FILE not found."
            exit 1
          fi

          VERSION_CODE="$(grep '^versionCode=' "$VERSION_FILE" | cut -d'=' -f2)"
          VERSION_NAME="$(grep '^versionName=' "$VERSION_FILE" | cut -d'=' -f2)"

          if [[ -z "$VERSION_CODE" || -z "$VERSION_NAME" ]]; then
            echo "ERROR: version.properties must contain versionCode and versionName."
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: versionCode must be a positive integer."
            exit 1
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: versionName must follow X.Y.Z format."
            exit 1
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "version.properties:"
          echo "  versionCode=$VERSION_CODE"
          echo "  versionName=$VERSION_NAME"

      # ------------------------------------------------------------
      # Validate PR title == version.properties versionName
      # ------------------------------------------------------------

      - name: Validate release version
        shell: bash
        env:
          PR_VERSION: ${{ steps.pr.outputs.version_name }}
          FILE_VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          if [[ "$PR_VERSION" != "$FILE_VERSION" ]]; then
            echo "ERROR: Release version mismatch."
            echo "PR title version:       $PR_VERSION"
            echo "version.properties:     $FILE_VERSION"
            exit 1
          fi

          echo "Release version validated: $FILE_VERSION"

      # ------------------------------------------------------------
      # Validate versionCode == previous main versionCode + 1
      #
      # The first parent of the merged commit is the previous state
      # of main for normal merge/squash/rebase merges.
      # ------------------------------------------------------------

      - name: Validate versionCode increment
        shell: bash
        env:
          CURRENT_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if [[ -z "$MERGE_COMMIT_SHA" || "$MERGE_COMMIT_SHA" == "null" ]]; then
            echo "ERROR: GitHub did not provide a merge commit SHA."
            exit 1
          fi

          PARENT_SHA="$(git rev-parse "${MERGE_COMMIT_SHA}^1")"

          if ! git cat-file -e "${PARENT_SHA}:version.properties" 2>/dev/null; then
            echo "ERROR: version.properties does not exist in the previous main commit."
            exit 1
          fi

          PREVIOUS_VERSION_CODE="$(
            git show "${PARENT_SHA}:version.properties" \
              | grep '^versionCode=' \
              | cut -d'=' -f2
          )"

          if [[ -z "$PREVIOUS_VERSION_CODE" ]]; then
            echo "ERROR: Could not read previous versionCode."
            exit 1
          fi

          if ! [[ "$PREVIOUS_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Previous versionCode is invalid."
            exit 1
          fi

          EXPECTED_VERSION_CODE=$((PREVIOUS_VERSION_CODE + 1))

          echo "Previous versionCode: $PREVIOUS_VERSION_CODE"
          echo "Current versionCode:  $CURRENT_VERSION_CODE"
          echo "Expected versionCode: $EXPECTED_VERSION_CODE"

          if [[ "$CURRENT_VERSION_CODE" -ne "$EXPECTED_VERSION_CODE" ]]; then
            echo "ERROR: versionCode must be exactly previous versionCode + 1."
            exit 1
          fi

          echo "versionCode increment validated."

      # ------------------------------------------------------------
      # Prevent duplicate GitHub Release / tag
      # ------------------------------------------------------------

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release $TAG already exists."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Git tag $TAG already exists."
            exit 1
          fi

      # ------------------------------------------------------------
      # Validate Android project
      # ------------------------------------------------------------

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # ------------------------------------------------------------
      # Build unsigned release APK
      # ------------------------------------------------------------

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Locate unsigned APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

          echo "Unsigned APK:"
          echo "$APK"

      # ------------------------------------------------------------
      # Locate Android SDK Build Tools
      # ------------------------------------------------------------

      - name: Locate Android SDK Build Tools
        id: build_tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$BUILD_TOOLS" ]]; then
            echo "ERROR: Android Build Tools not found."
            exit 1
          fi

          if [[ ! -x "$BUILD_TOOLS/zipalign" ]]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [[ ! -x "$BUILD_TOOLS/apksigner" ]]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "path=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

          echo "Using Android Build Tools:"
          echo "$BUILD_TOOLS"

      # ------------------------------------------------------------
      # Decode release keystore
      # ------------------------------------------------------------

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          echo "Release keystore prepared."

      # ------------------------------------------------------------
      # Zipalign BEFORE signing
      # ------------------------------------------------------------

      - name: Zipalign release APK
        id: zipalign
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          BUILD_TOOLS: ${{ steps.build_tools.outputs.path }}
        run: |
          set -euo pipefail

          ALIGNED_APK="$RUNNER_TEMP/OhMyGOAD-aligned.apk"

          "$BUILD_TOOLS/zipalign" \
            -P 16 \
            -f \
            4 \
            "$APK_PATH" \
            "$ALIGNED_APK"

          echo "aligned_apk=$ALIGNED_APK" >> "$GITHUB_OUTPUT"

          echo "APK successfully zipaligned."

      # ------------------------------------------------------------
      # Verify ZIP alignment BEFORE signing
      # ------------------------------------------------------------

      - name: Verify APK alignment
        shell: bash
        env:
          ALIGNED_APK: ${{ steps.zipalign.outputs.aligned_apk }}
          BUILD_TOOLS: ${{ steps.build_tools.outputs.path }}
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/zipalign" \
            -v \
            -c \
            -P 16 \
            4 \
            "$ALIGNED_APK"

      # ------------------------------------------------------------
      # Sign APK
      # ------------------------------------------------------------

      - name: Sign release APK
        id: sign
        shell: bash
        env:
          ALIGNED_APK: ${{ steps.zipalign.outputs.aligned_apk }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TOOLS: ${{ steps.build_tools.outputs.path }}
        run: |
          set -euo pipefail

          SIGNED_APK="$RUNNER_TEMP/OhMyGOAD-signed.apk"

          cp "$ALIGNED_APK" "$SIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            "$SIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

          echo "APK successfully signed."

      # ------------------------------------------------------------
      # Verify APK signature
      # ------------------------------------------------------------

      - name: Verify APK signature
        shell: bash
        env:
          SIGNED_APK: ${{ steps.sign.outputs.signed_apk }}
          BUILD_TOOLS: ${{ steps.build_tools.outputs.path }}
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$SIGNED_APK"

      # ------------------------------------------------------------
      # Prepare final APK
      # ------------------------------------------------------------

      - name: Prepare final APK
        id: final_apk
        shell: bash
        env:
          SIGNED_APK: ${{ steps.sign.outputs.signed_apk }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          FINAL_APK="$RUNNER_TEMP/OhMyGOAD-v${VERSION_NAME}.apk"

          cp "$SIGNED_APK" "$FINAL_APK"

          echo "path=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "filename=OhMyGOAD-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

          echo "Final APK:"
          echo "$FINAL_APK"

      # ------------------------------------------------------------
      # Generate SHA-256
      # ------------------------------------------------------------

      - name: Generate APK SHA-256
        id: checksum
        shell: bash
        env:
          FINAL_APK: ${{ steps.final_apk.outputs.path }}
        run: |
          set -euo pipefail

          SHA256="$(sha256sum "$FINAL_APK" | cut -d' ' -f1)"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "APK SHA-256:"
          echo "$SHA256"

      # ------------------------------------------------------------
      # Generate latest.json
      # ------------------------------------------------------------

      - name: Generate latest.json
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/v${VERSION_NAME}/OhMyGOAD-v${VERSION_NAME}.apk"

          cat > latest.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "downloadUrl": "${DOWNLOAD_URL}",
            "sha256": "${SHA256}"
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      # ------------------------------------------------------------
      # Create GitHub Release
      #
      # --target guarantees that the automatically-created tag points
      # to the exact merged commit that was built and signed.
      # ------------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          FINAL_APK: ${{ steps.final_apk.outputs.path }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          TAG="v${VERSION_NAME}"

          gh release create "$TAG" \
            "$FINAL_APK" \
            latest.json \
            --target "$MERGE_COMMIT_SHA" \
            --title "OhMyGOAD ${VERSION_NAME}" \
            --generate-notes \
            --latest \
            --fail-on-no-commits

      # ------------------------------------------------------------
      # Cleanup sensitive material
      # ------------------------------------------------------------

      - name: Cleanup keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"